name: btludptdd
description: "A new Flutter project using Clean Architecture + Firebase Firestore."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^16.2.4
  equatable: ^2.0.7
  flutter_dotenv: ^6.0.0
  font_awesome_flutter: ^10.7.0
  flutter_svg: ^2.2.1

  # ✅ Firebase packages tương thích
  firebase_core: ^3.5.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.1.2

  # --- Env & tiện ích ---
  intl: ^0.19.0  # format tiền, ngày, v.v.
  cached_network_image: ^3.3.1 # load ảnh từ Firestore nhanh
  uuid: ^4.5.1  # tạo ID đơn hàng
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/images/
    - assets/icons/
